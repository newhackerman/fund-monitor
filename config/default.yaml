monitor:
  interval: 60
  fast_mode: false
  max_retries: 3
  retry_delay: 1
  warmup_on_start: true
  warmup_periods_1m: 240
  market_hours:
    start: 09:30
    end: '15:00'
    noon_break:
      start: '11:30'
      end: '13:00'
indicators:
  macd:
    fast: 14
    slow: 20
    signal: 9
  rsi:
    period: 15
  atr:
    period: 14
signals:
  cooldown_minutes: 60
  max_new_buys_per_cycle: 2
  buy:
    mode: breakout_pullback_plus_continuation
    allowed_sessions:
    - start: 09:40
      end: '10:40'
    - start: '13:05'
      end: '14:08'
    disable_new_buy_after: '14:08'
    trend_rsi_min: 56
    trend_rsi_max: 71
    max_rsi_for_entry: 69
    require_ma_uptrend: true
    min_ma5_rise_pct: 0.006
    min_ma10_rise_pct: 0.003
    min_breakout_strength_pct: 0.22
    breakout_min_pct: 0.31
    breakout_lookback_minutes: 10
    min_volume_ratio: 1.03
    max_pullback_pct: 0.49
    pullback_min_pct: 0.055
    pullback_max_pct: 0.3
    require_first_pullback: true
    allow_continuation_entry: true
    continuation_min_breakout_persistence_pct: 0.011
    continuation_min_rebound_strength_pct: 0.28
    continuation_max_ma5_gap_pct: 0.17
    continuation_min_volume_ratio: 1.12
    continuation_max_rsi: 70
    allow_reclaim_entry: true
    reclaim_min_rsi: 60
    reclaim_max_rsi: 63
    reclaim_min_volume_ratio: 0.94
    reclaim_min_pullback_pct: 0.18
    reclaim_max_pullback_pct: 0.35
    reclaim_min_rebound_strength_pct: 0.24
    allow_late_strong_entry: true
    late_allowed_session:
      start: '14:08'
      end: '14:30'
    late_min_rsi: 58
    late_max_rsi: 79
    late_min_volume_ratio: 1.17
    late_min_breakout_strength_pct: 0.32
    late_min_breakout_persistence_pct: 0.1
    late_min_rebound_strength_pct: 0.35
    late_max_ma5_gap_pct: 0.25
  sell:
    require_open_position: true
    take_profit_pct: 7.0
    stop_loss_pct: 1.05
    trailing_drawdown_pct: 0.85
    max_hold_minutes: 14
    stale_exit_minutes: 12
    stale_exit_max_profit_pct: 0.25
    stale_exit_profit_ceiling_pct: 0.05
    allow_overnight: false
  atr:
    period: 14
    stop_loss_multiplier: 2.3
    take_profit_multiplier: 2.7
    min_stop_loss_pct: 0.55
    max_stop_loss_pct: 0.95
    enable_trailing_take_profit: true
    trailing_buffer_multiplier: 0.8
exploration:
  enabled: true
  interval_minutes: 10
  collect_data_minutes: 120
  max_cycles_per_run: 5
  population_size: 8
  lookback_days: 10
  threshold:
    min_signals: 2
    min_win_rate: 0.5
    min_total_profit: 0.02
